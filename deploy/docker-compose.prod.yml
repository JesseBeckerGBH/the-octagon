version: "3.9"

services:
  octagon-live:
    build:
      context: ..
      dockerfile: inference_onnx/Dockerfile
    container_name: octagon-live
    restart: always
    volumes:
      - ../data:/app/data:ro
    environment:
      - APP_ENV=production
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 30s
      timeout: 10s
      retries: 3

  octagon-validator:
    build:
      context: ..
      dockerfile: inference_onnx/Dockerfile
    container_name: octagon-validator
    restart: always
    command: python -m validator.post_event_validator --daily --report
    volumes:
      - ../data:/app/data
    depends_on:
      - octagon-live
    environment:
      - TZ=America/Phoenix

  redis:
    image: redis:7-alpine
    restart: always
    volumes:
      - redis_data:/data

volumes:
  redis_data:
