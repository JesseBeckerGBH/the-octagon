# THE OCTAGON — runtime configuration
# Directives layer of the D.O.E. architecture: everything tunable lives here,
# never hard-coded in the model/orchestrator code.

app:
  name: "THE OCTAGON"
  env: "${APP_ENV:development}"

paths:
  duckdb: "data/processed/octagon.duckdb"
  raw_data: "data/raw"
  reports: "data/reports"

ingestion:
  base_url: "http://ufcstats.com"
  user_agent: "TheOctagon/2.0 (JBAnalytics LLC)"
  request_delay_seconds: 1.2
  retries: 3

council:
  # Starting weights for the plain weighted-average blend (mode 3).
  # Superseded by orchestrator/council.py's fit_calibrated_stacker() (mode
  # 1, the production-proven recipe) once
  # validation.min_predictions_before_stacking is met — these weights are
  # what a fresh install runs on before there's enough history to
  # calibrate.
  weights:
    gbm: 0.3
    lightgbm: 0.3
    logistic: 0.2
    randomforest: 0.2
    markov: 0.0
    bayesian: 0.0
    lstm: 0.0
    sharp_money: 0.0
  # A prophet with status "stub" is excluded from the live blend until
  # promoted — see README roadmap for what's implemented vs. planned.
  status:
    gbm: active
    lightgbm: active
    logistic: active
    randomforest: active
    markov: active
    bayesian: experimental
    lstm: stub
    sharp_money: stub

calibration:
  method: isotonic       # isotonic | platt | temperature
  target_brier: 0.18
  # Presentation gate (orchestrator/gating.py) — ported from the 90-day
  # playbook in the analysis of the live thebeastufc.com model. Bands are
  # [low, high) on confidence = max(prob_a, 1 - prob_a). Shipped empty
  # originally: nothing gated until backtesting/engine.py had been run
  # against real data and confirmed a band (or weight class) is actually
  # bad here too — production's own numbers were never copied in blind.
  #
  # Below are that confirmation, from the first full walk-forward run
  # against the real 4,429-fight leak-safe dataset (2,976 OOS predictions,
  # 2018-2025, backtesting/results/backtest_report.txt):
  #   - 50-55% confidence: n=994, accuracy 51.2%, ROI -2.2%. Large sample,
  #     clearly a coin flip the model shouldn't be presenting as a pick.
  #   - Catch Weight: n=38, accuracy 36.8%, ROI -29.7%. Small sample, but
  #     catchweight bouts are structurally odd matchups with thin history
  #     — exactly the "flag until proven out" case this gate exists for.
  #   Women's Bantamweight ran slightly negative too (n=111, ROI -2.0%)
  #   but close enough to breakeven at that sample size that it's a watch
  #   item, not gated yet — re-check after more fights accumulate.
  suppressed_confidence_bands: [[0.50, 0.55]]
  flagged_weight_classes: ["Catch Weight"]

validation:
  min_predictions_before_stacking: 50

staking:
  # Ported from the tennis Council of Prophets project — fractional Kelly
  # with a hard cap. bankroll here is a paper-trading unit, not real money,
  # until the product actually stakes real bets.
  bankroll: 1000.0
  kelly_fraction: 0.25
  max_stake_pct: 0.05
  min_edge: 0.02
